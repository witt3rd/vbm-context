# scripts/land.conf: this repository's landing configuration. Data, not code: LAND_KEY=value per line, no expansion, unknown keys are errors. Every key and its default: the README of the pinned lander (vbm-land).
# Read from origin/<base>, so a change cannot loosen the rules it is judged by.
LAND_BASE=main

# Tier 1 (the gate): runs on the rebased combination.
LAND_TEST_CMD=mise exec -- scripts/tier1.sh

# Red main: the Tier 1 job of the latest push run of this workflow (an infrastructure failure is not red).
LAND_CI_WORKFLOW=ci.yml
LAND_TIER1_JOB=tier1
LAND_RED_MODE=push

# Size budget: production lines under VbmContext/ (a `Diff-Budget: <note>` trailer waives it). Commit rules: Conventional Commits.
LAND_PROD_PATHS=VbmContext
LAND_BUDGET_LINES=150
LAND_CONVENTIONAL=1

# The gate-defining set: a change that touches it never counts as a fix for a red main, and is judged by the hooks (scripts/land.d/: the diff judge after the rebase, the relabel-attack suite after Tier 1).
LAND_PROTECTED=scripts/land.conf scripts/land.d/* scripts/land/* scripts/land-direct

# Gate-edit approvals (the vendored lander's mechanism, scripts/land/docs/gate-edit-approvals.md): these files may only GAIN lines; a removed or changed line is accepted only on an exact-diff approval already on main
# (scripts/gate-edit-approvals.txt, one line per approval, one-time, 7 days). The diff judge (scripts/land.d/post-rebase) then accepts the removed lines of exactly those files; it still refuses a masked added line.
LAND_GATE_APPEND_ONLY=lean-toolchain mise.toml lakefile.lean scripts/tier1.sh scripts/ran-gates.txt scripts/protected-paths.txt scripts/public-banned-hashes.txt scripts/attacks/*
LAND_APPROVALS=scripts/gate-edit-approvals.txt
LAND_APPROVAL_DAYS=7

# The relabel-attack suite runs in scripts/land.d/post-tier1 and may take minutes: every hook step gets this bound.
LAND_STEP_TIMEOUT=1800
